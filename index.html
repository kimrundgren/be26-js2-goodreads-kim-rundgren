<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Goodreads – Kim Rundgren</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="./src/styles/global.css">
</head>

<body>
	<header class="border-bottom">
		<nav class="container py-3 px-0">
			<div class="d-flex align-items-center gap-4">

				<a href="/" class="navbar-brand d-flex align-items-center link-body-emphasis text-decoration-none gap-3">
					<img src="./public/book-nook-logo-purple.png" alt="Thin lined open book on solid black background" height="32" width="32">
					<span class="fs-5">The Book Nook</span>
				</a>

				<div class="d-flex align-items-center flex-grow-1">
					<ul class="nav">
						<li class="nav-item"><a href="#" class="nav-link">Home</a></li>
						<li class="nav-item"><a href="#" class="nav-link active">My books</a></li>
						<li class="nav-item"><a href="#" class="nav-link">Browse</a></li>
						<li class="nav-item"><a href="#" class="nav-link">Community</a></li>
					</ul>

					<div class="ms-auto d-flex align-items-center gap-3">
						<div class="dropdown d-flex align-items-center gap-1">
							<span>Ethan Caldwell</span>
							<button class="btn d-flex align-items-center gap-1 dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
								<img src="https://github.com/mdo.png" alt="Ethan Caldwell" width="32" height="32" class="rounded-circle">
							</button>
							<ul class="dropdown-menu dropdown-menu-end">
								<li><a class="dropdown-item" href="#">Profile</a></li>
								<li><a class="dropdown-item" href="#">Settings</a></li>
								<li>
									<hr class="dropdown-divider">
								</li>
								<li><a class="dropdown-item" href="#">Log out</a></li>
							</ul>
						</div>
					</div>
				</div>

			</div>
		</nav>
	</header>

	<main>
		<div class="container py-5 px-0">

			<h1 class="fs-2 mb-4">My books</h1>

			<div class="d-flex justify-content-between align-items-center mb-5">
				<div class="d-flex gap-2">
					<button type="button" class="btn btn-dark">
						All
						<span class="badge badge-secondary"></span>
					</button>
					<button type="button" class="btn btn-outline-dark">
						Not read
						<span class="badge badge-secondary"></span>
					</button>
					<button type="button" class="btn btn-outline-dark">
						Read
						<span class="badge badge-secondary"></span>
					</button>
				</div>

				<button type="button" id="addBook" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addBookModal">Add book</button>
			</div>

			<ul id="bookList" class="list-unstyled">
				<li class="row border-bottom py-2 text-secondary small">
					<div class="col-3">Title</div>
					<div class="col-3">Author</div>
					<div class="col-2">Score</div>
					<div class="col-2">Status</div>
					<div class="col-2 text-end">Actions</div>
				</li>

				<!-- All books renders dynamicaly here -->
			</ul>

		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script type="module" src="./src/main.js"></script>
</body>

</html>
